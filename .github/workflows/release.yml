name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Publish
        run: dotnet publish SwiftDrop/SwiftDrop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish_output

      - name: Rename EXE
        run: mv publish_output/SwiftDrop.exe publish_output/SwiftDrop-Windows.exe

      - name: Create Continuous Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: 'This release is automatically updated with the latest changes pushed to the repository.'
          files: publish_output/SwiftDrop-Windows.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
