name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and Publish
        run: dotnet publish SwiftDrop/SwiftDrop.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true /p:PublishReadyToRun=false -o publish_output

      - name: Verify Published App
        shell: pwsh
        run: |
          if (!(Test-Path publish_output/SwiftDrop.exe)) {
            throw "publish_output/SwiftDrop.exe was not created."
          }

          $file = Get-Item publish_output/SwiftDrop.exe
          if ($file.Length -lt 65MB) {
            throw "Published executable is unexpectedly small: $([math]::Round($file.Length / 1MB, 2)) MB"
          }

          Write-Host "Published SwiftDrop.exe size: $([math]::Round($file.Length / 1MB, 2)) MB"

      - name: Rename EXE
        shell: pwsh
        run: Move-Item -Path publish_output/SwiftDrop.exe -Destination publish_output/SwiftDrop-Windows.exe -Force

      - name: Remove Previous Release Asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete-asset latest SwiftDrop-Windows.exe --yes --repo ${{ github.repository }} || exit 0

      - name: Create Continuous Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          body: 'This release is automatically updated with the latest changes pushed to the repository.'
          files: publish_output/SwiftDrop-Windows.exe
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
